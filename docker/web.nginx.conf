# SPA + reverse proxy.
#
# * /api/v1/*  → API container
# * everything else → /index.html (React Router takes over)
#
# Long cache for hashed assets, no cache for index.html.

upstream agentforge_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API requests to the API container.
    location /api/ {
        proxy_pass http://agentforge_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: long cache, immutable.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # No cache for HTML.
    location = /index.html {
        add_header Cache-Control "no-store";
    }
}
